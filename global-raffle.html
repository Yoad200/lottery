<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הגרלת גלובל 400₪</title>
<style>
  :root {
    --blue: #1a5fa8;
    --gold: #f1c40f;
    --orange: #e67e22;
    --green: #27ae60;
    --red: #c0392b;
    --bg: #0f1923;
    --bg2: #1a2d45;
    --card: rgba(255,255,255,0.05);
    --border: rgba(255,255,255,0.1);
  }
  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg);
    color: white;
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    direction: rtl;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* glow blobs */
  .blobs { position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
  .blob {
    position:absolute; border-radius:50%;
    filter: blur(80px); opacity:0.15;
    animation: drift 8s ease-in-out infinite alternate;
  }
  @keyframes drift { from{transform:translate(0,0)} to{transform:translate(30px,20px)} }

  .wrap { position:relative; z-index:1; max-width:780px; margin:0 auto; padding:0 16px 60px; }

  /* HEADER */
  header { text-align:center; padding:36px 0 24px; }
  .badge {
    display:inline-block; background:rgba(26,95,168,0.3);
    border:1px solid rgba(26,95,168,0.5); border-radius:50px;
    padding:4px 18px; font-size:0.75rem; color:#7eb8e8;
    letter-spacing:2px; text-transform:uppercase; margin-bottom:14px;
  }
  h1 {
    font-size: clamp(1.8rem,5vw,3rem); font-weight:900; margin-bottom:6px;
    background: linear-gradient(135deg,#f1c40f,#e67e22,#f1c40f);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  }
  .sub { color:#7eb8e8; font-size:0.9rem; }

  /* NAV */
  nav { display:flex; gap:8px; justify-content:center; margin-bottom:24px; flex-wrap:wrap; }
  .nav-btn {
    padding:10px 22px; border-radius:50px; border:none;
    font-size:0.9rem; font-weight:700; cursor:pointer;
    transition:all 0.2s; font-family:inherit;
    background:rgba(255,255,255,0.08); color:#aaa;
  }
  .nav-btn.active { background:var(--blue); color:white; }

  /* VIEWS */
  .view { display:none; }
  .view.active { display:block; }

  /* LEADERBOARD */
  .board { display:flex; flex-direction:column; gap:10px; }
  .row {
    background:var(--card); border:1px solid var(--border);
    border-radius:16px; padding:14px 16px;
    display:flex; align-items:center; gap:14px;
    transition:transform 0.2s;
    position:relative; overflow:hidden;
  }
  .row.first {
    background:linear-gradient(135deg,rgba(241,196,15,0.12),rgba(243,156,18,0.06));
    border-color:rgba(241,196,15,0.4);
  }
  .leader-tag {
    position:absolute; top:0; right:0;
    background:linear-gradient(135deg,#f1c40f,#e67e22);
    font-size:0.6rem; color:#000; font-weight:900;
    padding:3px 12px 3px 8px; border-radius:0 16px 0 16px;
    letter-spacing:1px;
  }
  .rank { width:34px; text-align:center; flex-shrink:0; font-weight:900; font-size:1.3rem; }
  .avatar {
    width:44px; height:44px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-weight:900; font-size:1.2rem;
  }
  .info { flex:1; min-width:0; }
  .wname { font-weight:800; font-size:1rem; margin-bottom:4px; }
  .bar-bg { height:6px; background:rgba(255,255,255,0.1); border-radius:99px; overflow:hidden; margin-bottom:5px; }
  .bar-fill { height:100%; border-radius:99px; transition:width 0.8s ease; }
  .stats { display:flex; gap:12px; font-size:0.75rem; color:#999; flex-wrap:wrap; }
  .score-box {
    text-align:center; flex-shrink:0;
    background:rgba(255,255,255,0.06); border-radius:12px; padding:6px 14px;
  }
  .score-box.gold { background:rgba(241,196,15,0.15); }
  .score-num { font-size:1.6rem; font-weight:900; line-height:1; }
  .score-lbl { font-size:0.65rem; color:#888; }

  .empty { text-align:center; color:#555; padding:60px 20px; font-size:1rem; }

  /* DRAW BTN */
  .draw-wrap { text-align:center; margin-top:28px; }
  .draw-btn {
    background:linear-gradient(135deg,#f1c40f,#e67e22);
    color:#000; border:none; border-radius:50px;
    padding:14px 40px; font-size:1.1rem; font-weight:900;
    cursor:pointer; box-shadow:0 4px 24px rgba(241,196,15,0.35);
    transition:transform 0.15s; font-family:inherit;
  }
  .draw-btn:hover { transform:scale(1.04); }

  /* ADMIN PANEL */
  .panel {
    background:var(--card); border:1px solid var(--border);
    border-radius:20px; padding:22px; margin-bottom:18px;
  }
  .panel h3 { font-size:0.95rem; color:#7eb8e8; margin-bottom:14px; }
  .form-grid {
    display:grid;
    grid-template-columns:1fr 72px 72px;
    gap:10px; margin-bottom:10px;
  }
  .form-grid-btn { display:flex; gap:8px; margin-top:4px; }
  label { font-size:0.72rem; color:#888; font-weight:700; display:block; margin-bottom:3px; }
  input[type=text], input[type=number], input[type=password] {
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:10px; padding:9px 12px;
    color:white; font-size:0.9rem; width:100%;
    outline:none; font-family:inherit;
    transition:border 0.2s;
  }
  input:focus { border-color:var(--blue); }
  input::placeholder { color:#555; }
  .btn {
    border:none; border-radius:10px; padding:9px 16px;
    font-weight:700; cursor:pointer; font-size:0.85rem;
    font-family:inherit; transition:opacity 0.2s; white-space:nowrap;
  }
  .btn:hover { opacity:0.85; }
  .btn-blue { background:var(--blue); color:white; }
  .btn-green { background:var(--green); color:white; }
  .btn-ghost { background:rgba(255,255,255,0.1); color:#ccc; }
  .btn-red { background:rgba(192,57,43,0.3); color:#e74c3c; }
  .btn-edit { background:rgba(26,95,168,0.3); color:#7eb8e8; }

  .worker-list { display:flex; flex-direction:column; gap:8px; }
  .worker-item {
    display:flex; align-items:center; gap:10px;
    background:rgba(255,255,255,0.04); border-radius:12px; padding:10px 12px;
  }
  .w-avatar {
    width:32px; height:32px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-weight:900; font-size:0.85rem;
  }
  .w-info { flex:1; }
  .w-name { font-weight:700; font-size:0.9rem; }
  .w-score { font-size:0.72rem; color:#888; }
  .w-actions { display:flex; gap:6px; }

  /* LOGIN */
  .login-box { text-align:center; max-width:340px; margin:0 auto; }
  .login-box .icon { font-size:2.5rem; margin-bottom:12px; }
  .login-box h3 { margin-bottom:16px; }
  .login-box input { max-width:260px; text-align:center; }

  /* MODAL */
  .modal-overlay {
    position:fixed; inset:0; background:rgba(0,0,0,0.85);
    z-index:1000; display:flex; align-items:center; justify-content:center;
    backdrop-filter:blur(8px); display:none;
  }
  .modal-overlay.open { display:flex; }
  .modal {
    background:linear-gradient(135deg,#1a2d45,#0f1923);
    border-radius:24px; padding:40px 44px; text-align:center;
    max-width:380px; width:90%;
    transition:all 0.3s;
  }
  .modal.spinning { border:2px solid #f39c12; box-shadow:0 0 40px #f39c1244; }
  .modal.done    { border:2px solid #f1c40f; box-shadow:0 0 60px #f1c40f55; }
  .modal-icon { font-size:3rem; margin-bottom:8px; }
  .modal-label { font-size:0.85rem; color:#aaa; margin-bottom:4px; }
  .modal-name {
    font-size:2rem; font-weight:900; margin:10px 0;
    transition:color 0.1s;
  }
  .modal-prize { font-size:2.5rem; font-weight:900; color:#2ecc71; margin:12px 0; }
  .modal-pts { font-size:0.8rem; color:#888; margin-bottom:20px; }
  .modal-close {
    background:var(--blue); color:white; border:none;
    border-radius:12px; padding:10px 28px; font-size:1rem;
    cursor:pointer; font-weight:700; font-family:inherit;
  }

  /* TOAST */
  #toast {
    position:fixed; top:20px; left:50%; transform:translateX(-50%);
    padding:10px 24px; border-radius:30px; font-weight:700;
    font-size:0.9rem; z-index:9999; pointer-events:none;
    opacity:0; transition:opacity 0.3s;
    color:white; white-space:nowrap;
  }
  #toast.show { opacity:1; }

  @media(max-width:480px) {
    .form-grid { grid-template-columns:1fr 60px 60px; }
    .stats { gap:8px; }
  }
</style>
</head>
<body>

<div class="blobs">
  <div class="blob" style="width:300px;height:300px;background:#1a5fa8;top:10%;left:5%;animation-delay:0s"></div>
  <div class="blob" style="width:250px;height:250px;background:#e67e22;top:60%;left:75%;animation-delay:2s"></div>
  <div class="blob" style="width:200px;height:200px;background:#27ae60;top:40%;left:50%;animation-delay:4s"></div>
</div>

<div id="toast"></div>

<!-- WINNER MODAL -->
<div class="modal-overlay" id="modal" onclick="closeModal(event)">
  <div class="modal" id="modalBox" onclick="event.stopPropagation()">
    <div class="modal-icon" id="mIcon">🎰</div>
    <div class="modal-label" id="mLabel">מגריל...</div>
    <div class="modal-name" id="mName">—</div>
    <div id="mResult" style="display:none">
      <div class="modal-prize" id="mPrize"></div>
      <div class="modal-pts" id="mPts"></div>
      <button class="modal-close" onclick="closeModal()">סגור 🎉</button>
    </div>
  </div>
</div>

<div class="wrap">

  <!-- HEADER -->
  <header>
    <div class="badge">גלובל כוח אדם</div>
    <h1>🏆 הגרלת 400 ₪</h1>
    <p class="sub">נקודה לכל חבר שהצטרף · נקודה לכל אירוע שנרשמת אליו</p>
  </header>

  <!-- NAV -->
  <nav>
    <button class="nav-btn active" onclick="showView('board',this)">🏅 טבלת ניקוד</button>
    <button class="nav-btn" onclick="showView('adminGate',this)" id="adminNavBtn">⚙️ ניהול</button>
  </nav>

  <!-- BOARD -->
  <div class="view active" id="view-board">
    <div class="board" id="board"></div>
    <div class="empty" id="emptyMsg" style="display:none">אין עובדים עדיין</div>
    <div class="draw-wrap" id="drawWrap" style="display:none">
      <button class="draw-btn" onclick="runDraw()">🎰 הגרל זוכה עכשיו!</button>
    </div>
  </div>

  <!-- LOGIN -->
  <div class="view" id="view-adminGate">
    <div class="panel login-box">
      <div class="icon">🔐</div>
      <h3>כניסת מנהל</h3>
      <div style="margin-bottom:12px">
        <input type="password" id="passInput" placeholder="סיסמה..." onkeydown="if(event.key==='Enter')tryLogin()">
      </div>
      <button class="btn btn-blue" onclick="tryLogin()">כניסה</button>
    </div>
  </div>

  <!-- ADMIN -->
  <div class="view" id="view-admin">

    <!-- Add/Edit form -->
    <div class="panel">
      <h3 id="formTitle">➕ הוסף עובד/ת</h3>
      <div class="form-grid">
        <div>
          <label>שם עובד/ת</label>
          <input type="text" id="fName" placeholder="שם מלא...">
        </div>
        <div>
          <label>👥 חברים</label>
          <input type="number" id="fFriends" value="0" min="0">
        </div>
        <div>
          <label>📅 אירועים</label>
          <input type="number" id="fEvents" value="0" min="0">
        </div>
      </div>
      <div class="form-grid-btn">
        <button class="btn btn-blue" id="submitBtn" onclick="submitForm()">הוסף</button>
        <button class="btn btn-ghost" id="cancelBtn" onclick="cancelEdit()" style="display:none">ביטול</button>
      </div>
    </div>

    <!-- Workers list -->
    <div class="panel" id="adminListPanel" style="display:none">
      <h3 id="listTitle">רשימת עובדים</h3>
      <div class="worker-list" id="adminList"></div>
    </div>

    <!-- Draw -->
    <div class="draw-wrap" id="adminDrawWrap" style="display:none">
      <button class="draw-btn" onclick="runDraw()">🎰 הגרל זוכה — 400 ₪</button>
    </div>

  </div>

</div>

<script>
// ===================== DATA =====================
const COLORS = ["#1a5fa8","#2980b9","#e67e22","#27ae60","#8e44ad","#c0392b","#16a085","#d35400"];
const ADMIN_PASS = "global2025"; // ← שנה את הסיסמה כאן
let workers = JSON.parse(localStorage.getItem("glb_workers") || "[]");
let editId = null;
let adminUnlocked = false;

function save() {
  localStorage.setItem("glb_workers", JSON.stringify(workers));
}

function totalScore(w) { return (w.friends||0) + (w.events||0); }

// ===================== RENDER =====================
function renderBoard() {
  const sorted = [...workers].sort((a,b) => totalScore(b)-totalScore(a));
  const board = document.getElementById("board");
  const empty = document.getElementById("emptyMsg");
  const drawWrap = document.getElementById("drawWrap");
  const adminDrawWrap = document.getElementById("adminDrawWrap");

  if (sorted.length === 0) {
    board.innerHTML = "";
    empty.style.display = "block";
    drawWrap.style.display = "none";
    if(adminDrawWrap) adminDrawWrap.style.display = "none";
    return;
  }
  empty.style.display = "none";
  drawWrap.style.display = adminUnlocked && sorted.length >= 2 ? "block" : "none";
  if(adminDrawWrap) adminDrawWrap.style.display = sorted.length >= 2 ? "block" : "none";

  const maxScore = totalScore(sorted[0]) || 1;

  board.innerHTML = sorted.map((w,i) => {
    const rank = i+1;
    const score = totalScore(w);
    const pct = (score/maxScore)*100;
    const medals = ["🥇","🥈","🥉"];
    const rankHtml = rank <= 3 ? `<span style="font-size:1.4rem">${medals[rank-1]}</span>` : `<span style="color:#aaa;font-size:0.9rem">#${rank}</span>`;
    return `
    <div class="row ${rank===1?'first':''}">
      ${rank===1?'<div class="leader-tag">מוביל/ה</div>':''}
      <div class="rank">${rankHtml}</div>
      <div class="avatar" style="background:linear-gradient(135deg,${w.color},${w.color}88);${rank===1?`box-shadow:0 0 16px ${w.color}66`:''}">
        ${w.name.charAt(0)}
      </div>
      <div class="info">
        <div class="wname">${w.name}</div>
        <div class="bar-bg"><div class="bar-fill" style="width:${pct}%;background:linear-gradient(90deg,${w.color},${w.color}99)"></div></div>
        <div class="stats">
          <span>👥 ${w.friends} חברים</span>
          <span>📅 ${w.events} אירועים</span>
        </div>
      </div>
      <div class="score-box ${rank===1?'gold':''}">
        <div class="score-num" style="color:${rank===1?'#f1c40f':'white'}">${score}</div>
        <div class="score-lbl">נקודות</div>
      </div>
    </div>`;
  }).join("");
}

function renderAdminList() {
  const sorted = [...workers].sort((a,b) => totalScore(b)-totalScore(a));
  const panel = document.getElementById("adminListPanel");
  const list = document.getElementById("adminList");
  const title = document.getElementById("listTitle");

  if (sorted.length === 0) { panel.style.display = "none"; return; }
  panel.style.display = "block";
  title.textContent = `רשימת עובדים (${sorted.length})`;

  list.innerHTML = sorted.map(w => `
    <div class="worker-item">
      <div class="w-avatar" style="background:${w.color}">${w.name.charAt(0)}</div>
      <div class="w-info">
        <div class="w-name">${w.name}</div>
        <div class="w-score">👥 ${w.friends} · 📅 ${w.events} · סה"כ: <strong style="color:#7eb8e8">${totalScore(w)}</strong></div>
      </div>
      <div class="w-actions">
        <button class="btn btn-edit" onclick="startEdit('${w.id}')">✏️</button>
        <button class="btn btn-red" onclick="deleteWorker('${w.id}')">🗑️</button>
      </div>
    </div>
  `).join("");
}

function render() { renderBoard(); if(adminUnlocked) renderAdminList(); }

// ===================== NAV =====================
function showView(name, btn) {
  if (name === "adminGate" && adminUnlocked) name = "admin";
  document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
  document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
  document.getElementById("view-"+name).classList.add("active");
  if(btn) btn.classList.add("active");
  else document.getElementById("adminNavBtn").classList.add("active");
}

// ===================== AUTH =====================
function tryLogin() {
  const val = document.getElementById("passInput").value;
  if (val === ADMIN_PASS) {
    adminUnlocked = true;
    document.getElementById("passInput").value = "";
    showView("admin");
    render();
    toast("ברוך הבא! 👋", "#27ae60");
  } else {
    toast("סיסמה שגויה ❌", "#c0392b");
  }
}

// ===================== FORM =====================
function submitForm() {
  const name = document.getElementById("fName").value.trim();
  if (!name) { toast("נא להזין שם", "#e67e22"); return; }
  const friends = parseInt(document.getElementById("fFriends").value)||0;
  const events  = parseInt(document.getElementById("fEvents").value)||0;

  if (editId) {
    workers = workers.map(w => w.id===editId ? {...w,name,friends,events} : w);
    cancelEdit();
    toast("עודכן בהצלחה ✓", "#1a5fa8");
  } else {
    workers.push({
      id: Date.now().toString(),
      name, friends, events,
      color: COLORS[workers.length % COLORS.length],
      joined: new Date().toLocaleDateString("he-IL")
    });
    document.getElementById("fName").value = "";
    document.getElementById("fFriends").value = "0";
    document.getElementById("fEvents").value = "0";
    toast(`${name} נוסף/ה! ✓`, "#27ae60");
  }
  save(); render();
}

function startEdit(id) {
  const w = workers.find(x => x.id===id);
  if (!w) return;
  editId = id;
  document.getElementById("fName").value = w.name;
  document.getElementById("fFriends").value = w.friends;
  document.getElementById("fEvents").value = w.events;
  document.getElementById("formTitle").textContent = "✏️ עריכת עובד/ת";
  document.getElementById("submitBtn").textContent = "שמור";
  document.getElementById("submitBtn").className = "btn btn-green";
  document.getElementById("cancelBtn").style.display = "inline-block";
  document.getElementById("fName").focus();
}

function cancelEdit() {
  editId = null;
  document.getElementById("fName").value = "";
  document.getElementById("fFriends").value = "0";
  document.getElementById("fEvents").value = "0";
  document.getElementById("formTitle").textContent = "➕ הוסף עובד/ת";
  document.getElementById("submitBtn").textContent = "הוסף";
  document.getElementById("submitBtn").className = "btn btn-blue";
  document.getElementById("cancelBtn").style.display = "none";
}

function deleteWorker(id) {
  const w = workers.find(x=>x.id===id);
  if(!confirm(`למחוק את ${w?.name}?`)) return;
  workers = workers.filter(x=>x.id!==id);
  save(); render();
  toast("הוסר ✓", "#c0392b");
}

// ===================== DRAW =====================
function runDraw() {
  if (workers.length < 2) return;
  const modal    = document.getElementById("modal");
  const modalBox = document.getElementById("modalBox");
  const mIcon    = document.getElementById("mIcon");
  const mLabel   = document.getElementById("mLabel");
  const mName    = document.getElementById("mName");
  const mResult  = document.getElementById("mResult");
  const mPrize   = document.getElementById("mPrize");
  const mPts     = document.getElementById("mPts");

  mIcon.textContent = "🎰";
  mLabel.textContent = "מגריל...";
  mName.style.color = "#f39c12";
  mResult.style.display = "none";
  modalBox.className = "modal spinning";
  modal.classList.add("open");

  let i = 0;
  const iv = setInterval(() => {
    mName.textContent = workers[i % workers.length].name;
    i++;
  }, 80);

  setTimeout(() => {
    clearInterval(iv);
    // weighted by score
    const tickets = [];
    workers.forEach(w => {
      const s = Math.max(totalScore(w), 1);
      for(let j=0;j<s;j++) tickets.push(w);
    });
    const winner = tickets[Math.floor(Math.random()*tickets.length)];
    mName.textContent = winner.name;
    mName.style.color = "#f1c40f";
    mIcon.textContent = "🎉";
    mLabel.textContent = "הזוכה הוא/היא";
    mPrize.textContent = "400 ₪ 🏆";
    mPts.textContent = `${totalScore(winner)} נקודות כולל`;
    mResult.style.display = "block";
    modalBox.className = "modal done";
  }, 2600);
}

function closeModal(e) {
  if(e && e.target !== document.getElementById("modal")) return;
  document.getElementById("modal").classList.remove("open");
}

// ===================== TOAST =====================
function toast(msg, color="#27ae60") {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.style.background = color;
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 2500);
}

// ===================== INIT =====================
render();
</script>
</body>
</html>
